services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: sqlite:////data/fieldwise.db
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      TF_NUM_INTRAOP_THREADS: "2"
      TF_NUM_INTEROP_THREADS: "2"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - fieldwise_data:/data
    expose:
      - "8080"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  fieldwise_data:
