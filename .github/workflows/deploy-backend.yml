name: Deploy backend to Google Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-run-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify model files are tracked
        run: |
          test -s backend/models/plant_disease_model.keras || { echo "Missing backend/models/plant_disease_model.keras in GitHub checkout. Add the model file to the repository before deploying."; exit 1; }
          test -s backend/models/class_names.json || { echo "Missing backend/models/class_names.json in GitHub checkout."; exit 1; }

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy API to Cloud Run
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
        run: |
          set -euo pipefail
          test -n "$GCP_PROJECT_ID" || { echo "Set the GCP_PROJECT_ID repository variable."; exit 1; }
          test -n "$GCP_REGION" || { echo "Set the GCP_REGION repository variable."; exit 1; }
          test -n "$DATABASE_URL" || { echo "Set the DATABASE_URL repository secret to a PostgreSQL connection URL."; exit 1; }
          test -n "$CORS_ORIGINS" || { echo "Set the CORS_ORIGINS repository variable to the frontend origin."; exit 1; }
          gcloud config set project "$GCP_PROJECT_ID"
          printf 'DATABASE_URL=%s\nCORS_ORIGINS=%s\n' "$DATABASE_URL" "$CORS_ORIGINS" > "$RUNNER_TEMP/cloud-run-env.txt"
          gcloud run deploy fieldwise-api \
            --source ./backend \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --memory 2Gi \
            --cpu 1 \
            --max 1 \
            --allow-unauthenticated \
            --env-vars-file "$RUNNER_TEMP/cloud-run-env.txt" \
            --quiet
          rm -f "$RUNNER_TEMP/cloud-run-env.txt"
