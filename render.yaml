services:
  - type: web
    name: fieldwise-plant-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: CORS_ORIGINS
        value: https://shivamm070402.github.io,https://fieldwise-plant-health-dashboard.netlify.app
      - key: TF_NUM_INTRAOP_THREADS
        value: "2"
      - key: TF_NUM_INTEROP_THREADS
        value: "2"
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: fieldwise-plant-db
          property: connectionString

databases:
  - name: fieldwise-plant-db
    databaseName: fieldwise
    user: fieldwise
    plan: free
    region: singapore
